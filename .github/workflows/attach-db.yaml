name: attach-database
on:
  workflow_dispatch:
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Attach Postgres
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl postgres attach billowing-meadow-8816 -a churn-prediction-app --yes
